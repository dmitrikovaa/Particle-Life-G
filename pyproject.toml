[project]
name = "particle-life-g"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zara", email = "zarasyed05@hotmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # modern Python syntax
    "E"
]